<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Gül Animasyonu 🌹</title>
<style>
body {
  margin: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  height: 100vh;
  overflow: hidden;
}

/* Tohum */
.seed {
  width: 10px;
  height: 10px;
  background: brown;
  border-radius: 50%;
  position: absolute;
  bottom: 0;
  animation: sprout 2s forwards;
}

/* Dal */
.stem {
  width: 4px;
  height: 0;
  background: green;
  position: absolute;
  bottom: 5px;
  left: 50%;
  transform: translateX(-50%);
  animation: growStem 3s forwards;
  animation-delay: 2s;
  transform-origin: bottom center;
  border-radius: 2px;
}

/* Yapraklar */
.leaf {
  width: 30px;
  height: 15px;
  background: linear-gradient(135deg, #4caf50, #2e7d32);
  position: absolute;
  border-radius: 50%;
  opacity: 0;
}

.leaf.left { transform: rotate(-45deg); left: -25px; top: 30px; animation: leafGrow 1s forwards; animation-delay: 4s; }
.leaf.right { transform: rotate(45deg); right: -25px; top: 30px; animation: leafGrow 1s forwards; animation-delay: 4.5s; }

@keyframes sprout {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes growStem {
  0% { height: 0; }
  100% { height: 150px; }
}

@keyframes leafGrow {
  0% { transform: scale(0) rotate(0deg); opacity: 0; }
  100% { transform: scale(1) rotate(var(--rotate)); opacity: 1; }
}

/* Çiçek tomurcuğu */
.bud {
  width: 0;
  height: 0;
  background: radial-gradient(circle at 50% 50%, #ff4da6, #ff66cc);
  position: absolute;
  bottom: 150px;
  left: 50%;
  transform: translateX(-50%) scale(0);
  border-radius: 50%;
  animation: bloomBud 2s forwards;
  animation-delay: 5s;
  box-shadow: 0 0 20px #ff66cc;
}

@keyframes bloomBud {
  0% { transform: translateX(-50%) scale(0); opacity: 0; }
  60% { transform: translateX(-50%) scale(1.1); opacity: 1; }
  100% { transform: translateX(-50%) scale(1); }
}
</style>
</head>
<body>

<div class="seed"></div>
<div class="stem"></div>
<div class="leaf left"></div>
<div class="leaf right"></div>
<div class="bud"></div>

</body>
</html>
