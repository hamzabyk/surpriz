<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sana Bir Sürpriz 🌸</title>

<style>
body {
  margin: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

/* Çiçek container */
.flower {
  position: relative;
  width: 200px;
  height: 200px;
  transform: rotate(-45deg);
}

/* Yapraklar */
.petal {
  position: absolute;
  width: 100px;
  height: 100px;
  background: radial-gradient(circle at 30% 30%, #ff66cc, #8000ff);
  border-radius: 50%;
  transform: scale(0) rotate(0deg);
  animation: bloom 2s forwards;
}

/* Yaprak pozisyonları ve animasyon delay */
.petal:nth-child(1) { top: 0; left: 50px; animation-delay: 0.2s; transform-origin: bottom center; }
.petal:nth-child(2) { top: 50px; left: 100px; animation-delay: 0.4s; transform-origin: left center; }
.petal:nth-child(3) { top: 100px; left: 50px; animation-delay: 0.6s; transform-origin: top center; }
.petal:nth-child(4) { top: 50px; left: 0; animation-delay: 0.8s; transform-origin: right center; }
.petal:nth-child(5) { top: 25px; left: 25px; animation-delay: 1s; transform-origin: center center; }

/* Orta kısım */
.center {
  position: absolute;
  top: 50px;
  left: 50px;
  width: 100px;
  height: 100px;
  background: radial-gradient(circle, #ff99ff, #ff66cc);
  border-radius: 50%;
  box-shadow: 0 0 30px #ff99ff, 0 0 60px #ff66cc;
  transform: scale(0);
  animation: bloom 1.5s forwards;
}

/* Açılma animasyonu */
@keyframes bloom {
  0% { transform: scale(0) rotate(-20deg); opacity: 0; }
  60% { transform: scale(1.1) rotate(10deg); opacity: 1; }
  80% { transform: scale(0.95) rotate(-5deg); }
  100% { transform: scale(1) rotate(0deg); }
}

/* Yazı */
.text {
  position: absolute;
  top: 75%;
  width: 100%;
  text-align: center;
  color: #ff99ff;
  font-size: 32px;
  font-family: 'Segoe UI', sans-serif;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeIn 2s forwards;
  animation-delay: 2.2s;
}

@keyframes fadeIn {
  0% { opacity: 0; transform: translateY(20px); }
  50% { opacity: 1; transform: translateY(-5px); }
  100% { opacity: 1; transform: translateY(0); }
}
</style>

</head>
<body>

<div class="flower">
  <div class="petal"></div>
  <div class="petal"></div>
  <div class="petal"></div>
  <div class="petal"></div>
  <div class="petal"></div>
  <div class="center"></div>
</div>

<div class="text">Seni Çok Seviyorum ❤️</div>

</body>
</html>
